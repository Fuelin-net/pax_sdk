name: pax_sdk
description: "A Flutter plugin for PAX payment terminals providing NFC card reading, thermal printer, and barcode scanner functionality."
version: 1.0.5
homepage: https://github.com/Fuelin-net/pax_sdk
repository: https://github.com/Fuelin-net/pax_sdk
issue_tracker: https://github.com/Fuelin-net/pax_sdk/issues

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.example.pax_sdk_package
        pluginClass: paxSDK
        mainClass: com.example.pax_sdk_package.paxSDK
